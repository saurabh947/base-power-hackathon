# fleet-sim configuration: the one place for fleet, physics, strategy and
# orchestration knobs (spec section 6). Loaded by src/config.py.
# Decisions behind these values are in RUNLOG.md.

seed: 42                    # seeds battery specs and anything else random

sim:
  tick_seconds: 300         # 5-minute ticks
  decision_lag_ticks: 3     # strategy sees the last *published* price (one 15-min interval late)

fleet:
  size: 20000               # 20 workers x 1,000 batteries
  workers: 20
  locations:                # the Texas Triangle, by metro population (weights sum to 1)
    LZ_HOUSTON: 0.35        # Houston            7,000 batteries (b00000-b06999)
    LZ_NORTH: 0.40          # Dallas-Fort Worth  8,000 batteries (b07000-b14999)
    LZ_CPS: 0.13            # San Antonio        2,600 batteries (b15000-b17599)
    LZ_AEN: 0.12            # Austin             2,400 batteries (b17600-b19999)

battery:                    # per-battery specs drawn uniformly, seeded (ranges confirmed by the human)
  power_kw: [5.0, 11.5]     # max grid-side charge/discharge rate
  capacity_kwh: [10.0, 20.0]
  cap_power_at_capacity: true   # power_kw <= capacity_kwh (at most 1C)
  efficiency: 0.90          # round-trip; sqrt(eta) lost each way (ASSUMPTION, human-adjustable)
  soc_bounds: [0.20, 1.00]  # 0.20 = safety reserve floor
  soc_init: 0.5
  demo_soc_init: 0.9        # demo preset: fleet pre-charged before the spike evening

strategy:
  name: bands               # bands | peak  (the seam swaps here)
  bands:
    low_percentile: 25      # charge at or below p25
    high_percentile: 90     # discharge at or above p90 (and price > 0)
    window_days: 7          # trailing window, excludes the current tick
    min_samples: 288        # hold until one day of history exists
  peak:
    timezone: America/Chicago
    charge_window: ["10:00", "15:00"]      # half-open [start, end)
    discharge_window: ["18:00", "21:00"]

orchestration:
  heartbeat_interval_s: 2   # worker SETs hb:{worker_id} every 2 s
  heartbeat_ttl_s: 6        # key TTL
  deadline_miss_threshold: 2  # DEAD after 2 missed tick deadlines (or heartbeat expiry)
  deadline_cap_ms: 250      # telemetry barrier: min(cap, max(floor, fraction x tick period))
  deadline_fraction: 0.5    #   = 250 ms at 1-2 ticks/s, 100 ms at 5-10 ticks/s
  deadline_floor_ms: 100    # headroom for 20 workers on 4 vCPUs at 10 ticks/s (0 = spec-literal 50 ms)
  max_speed_deadline_ms: 250  # barrier at 'max' speed (tests/bench)
  xread_block_ms: 1000      # must stay < 5 s (redis-py socket timeouts)
  load_timeout_s: 20        # workers must load their cohort at run start within this
  spawn_timeout_s: 30       # a new worker with no heartbeat by then is DEAD
  stream_maxlen:            # MAXLEN ~ per stream
    commands: 64
    telemetry: 400
    dead_letter: 20000
    events: 500
    ticks: 2100
    control: 500

# The replay years visitors pick (docs/API.md Settings.year; GET /settings `years`). src/data/years.py says where
# each one's real prices end (real_until_utc): 2025 is real all year; 2026 is published year-to-date, and after its
# last real interval the replay uses the AI's prediction (src/forecast/predict.py).
years:
  default: 2025
  items: [2025, 2026]

# Replay presets for the website's Start screen (docs/UX.md). start_utc = replay start. Each preset belongs to one
# year. `start: evening_before_real_until` is computed: 6 pm Central on the evening before the year's
# real_until_utc (src/data/years.py evening_before), so it follows each new ERCOT publication.
presets:
  default: morning_spike     # the biggest spike of 2025
  default_by_year:           # what a Start with only a year replays
    2025: morning_spike
    2026: spike_2026
  items:
    - id: morning_spike
      year: 2025
      label: "Biggest spike of 2025"
      date_local: "2025-04-07"
      start_utc: "2025-04-07T08:00:00Z"   # 3:00 am CDT; Houston peaks $3,860/MWh around 6:45 am
      description: "The year's highest prices: all four cities pass $3,500/MWh just before 7 am."
    - id: ordinary_day
      year: 2025
      label: "An ordinary day"
      date_local: "2025-06-28"            # daily spread $64/$68 (Houston/North) ~ the 2025 medians $63/$68
      start_utc: "2025-06-28T05:00:00Z"
      description: "A typical day in all four cities, with small ups and downs."
    - id: jan1_2025
      year: 2025
      label: "From January 1"
      date_local: "2025-01-01"
      start_utc: "2025-01-01T06:00:00Z"   # midnight CST; the bands window warms up on Dec 25-31, 2024
      description: "The whole of 2025 from New Year's Day, real ERCOT prices all year."
    - id: spike_2026
      year: 2026
      label: "Biggest evening spike of 2026"
      date_local: "2026-04-24"
      start_utc: "2026-04-24T21:00:00Z"   # 4:00 pm CDT; 7:45 pm: Houston $1,051.54, DFW $1,231.82, SA $1,096.97, Austin $1,105.20
      description: "All four cities jump above $1,000/MWh at 7:45 pm; Dallas–Fort Worth tops $1,200."
    - id: jan1_2026
      year: 2026
      label: "From January 1"
      date_local: "2026-01-01"
      start_utc: "2026-01-01T06:00:00Z"   # midnight CST; the bands window warms up on Dec 25-31, 2025 (real)
      description: "2026 from New Year's Day: real prices until they end, then the AI's prediction."

# Area sections, one owner each; read via src.config.load_raw_config().
data:       # owner: ingest (M1). python -m src.ingest.ercot; notes in docs/notes/data.md
  years: [2024, 2025, 2026] # ERCOT (America/Chicago) calendar years to ingest and check (2026: year to date)
  max_missing_pct: 0.1      # M1 self-check: missing intervals per series and year must stay below this %

api:        # owner: fleet + API
  port: 8000
  default_strategy: forecast  # falls back to bands (with a warning event) until src.strategy.forecast lands
  default_speed_tps: 2
  frame_interval_s: 1.0       # WebSocket /live frame cadence
  control_timeout_s: 4.0      # how long the API waits for the coordinator's reply
  price_spike_usd_mwh: 1000   # price_spike event threshold
  race_spike_usd_mwh: 300     # race_update compares the two fleets when any city's price reaches this
  action_event_min_ticks: 12  # at most one action_changed event per hour of market time
  rate_limits:
    run_start_s: 5            # one /run/start per 5 s (global)
    run_reset_s: 5            # one /run/reset per 5 s (global)
    availability_per_s: 10
    chaos_kill_s: 2           # one /chaos/kill per 2 s (global; crashing controllers is open to everyone)
    worker_restart_s: 2       # one POST /workers/{id}/restart per 2 s (global), like the kill

backtest:   # owner: backtest (M4). Read by src/backtest/runner.py:backtest_settings()
  year: 2025                            # the pitch year shown on the Results screen
  strategies: [bands, forecast, peak]   # the pitch set; one that isn't built is skipped and the results say so
  headline: [forecast, bands]           # the big number: the first of these that ran
  lag0_variant: true                    # also replay the spec-literal lag 0 (stored in metrics.lag0)
  forecast_min_coverage: 0.99           # skip 'forecast' unless forecasts cover 99% of the year's ticks
  warmup_days: 7                        # real prices before Jan 1 that fill the bands window
  results_dir: data/results             # JSON exports (runs/, pitch_<year>.json)
  ceiling:                              # "Best possible (perfect hindsight)", src/backtest/ceiling.py
    ratio_step: 0.05                    # power/capacity grid of the per-kWh LP (fleet: 0.25-1.0)
    cycles_per_day_cap: 1.0             # the capped reference; the headline ceiling is uncapped
    workers: 4                          # processes for the LP grid (1 = in-process)
  labels:                               # UI words (docs/UX.md glossary)
    bands: Simple rule
    forecast: AI forecast (TimesFM-3)
    peak: Evening peak
    hindsight: Best possible (perfect hindsight)

forecast:   # owner: forecasting (src/forecast, docs/notes/forecast.md)
  # timesfm-3.0: weights are non-commercial / non-production (OK'd for the demo).
  # timesfm-2.5: Apache-2.0, what production would use. Env FORECAST_MODEL overrides.
  model: timesfm-3.0
  weights_dir: models       # gitignored; the forecast image bakes weights into /app/models
  download: true            # fetch missing weights from Hugging Face (pinned revision, no token)
  device: cpu               # the Cloud Run job has no GPU
  batch_size: 32            # series per forward pass
  threads: 0                # 0 = every CPU the container may use
  timezone: America/Chicago
  locations: [LZ_HOUSTON, LZ_NORTH, LZ_CPS, LZ_AEN]
  demand_location: ERCOT
  da_publish_local: "13:30" # DA prices for day D are posted about 13:30 CT on D-1
  cache_dir: data/cache/forecasts   # parquet output of `--out parquet` (gitignored)
  # Plan chosen by measurement (docs/notes/forecast.md): ~515 TFLOP for 2025, 30-60 min on 8 vCPU.
  rt_price:                 # RT settlement price per location, $/MWh
    step_minutes: 15
    horizon_steps: 96       # next 24 h
    context_steps: 512      # 5.3 days of 15-min history (1024 was only 3% better, at 2x the cost)
    every_minutes: 60       # a new forecast every hour
    min_context_steps: 96
    covariates: da          # none | da. DA as known-future covariate: MAE -18% vs univariate
  demand:                   # ERCOT system load, MW
    step_minutes: 60
    horizon_steps: 48       # next 48 h
    context_steps: 336      # 14 days of hourly history (512 was 1% better)
    every_minutes: 60
    min_context_steps: 72   # load history starts 2025-01-01, so the first 3 days are skipped
  predict:                  # the AI's prediction for the rest of a year (src/forecast/predict.py, price_predictions)
    context_steps: 4096     # 42.7 days of 15-min real prices before real_until_utc (TimesFM-3 takes up to 15,360)
    chunk_days: 7           # chained: each 7-day chunk's p50 becomes context for the next
    cache_dir: data/cache/predictions   # parquet output of `--out parquet` (gitignored)
  strategy:                 # the forecast rule (src/strategy/forecast.py)
    horizon_hours: 12       # rank the decision price within the next 12 h of forecasts
                            # (4 h earns more but cycles 2x/day; 12 h cycles like the peak rule)
    max_age_hours: 6        # older forecasts are ignored (hold)
    min_points: 8           # hold if fewer than 2 h of forecast points remain
    charge_margin: 1.0      # charge only if price <= eta * margin * (price we expect to sell at)
    reserve_spike_usd: 0    # p90 above this ahead keeps reserve_soc back (0 = off; it cost revenue)
    reserve_soc: 0.5
