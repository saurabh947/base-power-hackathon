[project]
name = "fleet-sim"
version = "0.1.0"
description = "Home-battery fleet simulator trading against real ERCOT prices (hackathon build)."
readme = "RUNLOG.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "msgpack>=1.2.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=25.0.1",
    "python-calamine>=0.8.2",
    "pyyaml>=6.0",
    "redis>=5",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
forecast = [
    "timesfm[torch]>=3.0.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

# No [build-system]: uv installs only the dependencies. `src` is imported as a
# package from the repo root (python -m src.sim.skeleton; pytest pythonpath ".").

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: needs a running Postgres (later milestones)",
    "redis: needs a running Redis (later milestones)",
]
